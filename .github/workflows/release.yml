name: "Tag, Release"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "React.info.php"
      - "React.info.json"
      - "React.module.php"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    env:
      MODULE_NAME: "React"
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate PHP syntax and composer.json
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -exec php -l {} +
          if [ -f "composer.json" ]; then
            composer validate --strict --no-check-publish --no-check-version
          fi

      - name: Extract module version
        id: get_version
        run: |
          VERSION=$(php -r '
            $module = (string) getenv("MODULE_NAME");
            $v = null;
            if (is_file($module . ".info.php")) {
              $c = file_get_contents($module . ".info.php");
              if (is_string($c) && preg_match("/[\x27\"]version[\x27\"]\s*=>\s*[\x27\"]?([0-9\.]+)[\x27\"]?/", $c, $m)) {
                $v = $m[1];
              }
            } elseif (is_file($module . ".info.json")) {
              $data = json_decode((string) file_get_contents($module . ".info.json"), true);
              if (is_array($data) && isset($data["version"])) {
                $v = (string) $data["version"];
              }
            }
            if ($v === null && is_file($module . ".module.php")) {
              $c = file_get_contents($module . ".module.php");
              if (is_string($c) && preg_match("/[\x27\"]version[\x27\"]\s*=>\s*[\x27\"]?([0-9\.]+)[\x27\"]?/", $c, $m)) {
                $v = $m[1];
              }
            }
            if ($v === null || $v === "") {
              exit(1);
            }
            if (is_numeric($v) && !str_contains($v, ".")) {
              $n = (int) $v;
              $v = intdiv($n, 100) . "." . (intdiv($n, 10) % 10) . "." . ($n % 10);
            }
            echo $v;
          ')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not find the version number in ${{ env.MODULE_NAME }}.info.php, ${{ env.MODULE_NAME }}.info.json, or ${{ env.MODULE_NAME }}.module.php"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check tag and release status
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $TAG already exists. Skipping release creation."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git User
        if: steps.check_release.outputs.tag_exists == 'false'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create Git Tag
        if: steps.check_release.outputs.tag_exists == 'false'
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          echo "Generated Tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          REPO="${{ github.repository }}"
          git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 || git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --format="%H" "${PREV_TAG}..${TAG}")
            COMPARE_URL="https://github.com/$REPO/compare/$PREV_TAG...$TAG"
          else
            COMMITS=$(git log --format="%H" "${TAG}")
            COMPARE_URL="https://github.com/$REPO/commits/$TAG"
          fi

          for SHA in $COMMITS; do
            TITLE=$(git log --format="%s" -n 1 "$SHA")
            SHORT_SHA=$(git rev-parse --short "$SHA")

            LOGIN=$(gh api "repos/$REPO/commits/$SHA" --jq '.author.login // empty' 2>/dev/null || echo "")
            if [ -z "$LOGIN" ]; then
              LOGIN=$(git log --format="%an" -n 1 "$SHA")
            fi

            if [[ "$LOGIN" == *" "* ]]; then
              echo "* $TITLE by **$LOGIN** in $SHORT_SHA" >> release_notes.md
            else
              echo "* $TITLE by @$LOGIN in $SHORT_SHA" >> release_notes.md
            fi
          done

          echo "" >> release_notes.md
          echo "**Full Changelog**: $COMPARE_URL" >> release_notes.md

          REPO_NAME="${REPO#*/}"
          ZIP_FILE="${REPO_NAME}.zip"
          git archive --format=zip --prefix="${REPO_NAME}/" -o "$ZIP_FILE" "$TAG"

          gh release create "$TAG" "$ZIP_FILE" -F release_notes.md --title "$TAG"
